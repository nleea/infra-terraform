# Pipeline de despliegue: apply sobre main con aprobación manual
name: terraform-apply

on:
  push:
    branches: [main]
    paths:
      - "environments/**"
      - "modules/**"
      - ".terraform-version"
      - ".github/actions/terraform-init/**"
      - ".github/workflows/terraform-apply.yml"
      - ".github/workflows/_terraform-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Un único despliegue a la vez; nunca se cancela uno en curso
concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  dev:
    uses: ./.github/workflows/_terraform-deploy.yml
    with:
      environment: dev

  # Promoción: prod solo se despliega si dev terminó bien
  prod:
    needs: dev
    uses: ./.github/workflows/_terraform-deploy.yml
    with:
      environment: prod
