# Prepara un entorno para ejecutar Terraform: versión fijada, credenciales AWS por OIDC y backend remoto
name: terraform-init
description: Instala Terraform, asume el rol AWS por OIDC e inicializa el backend de un entorno

inputs:
  environment:
    description: Nombre del entorno (carpeta en environments/)
    required: true
  role-to-assume:
    description: ARN del rol IAM que se asume por OIDC
    required: true

outputs:
  working-directory:
    description: Carpeta raíz de Terraform del entorno
    value: ${{ steps.meta.outputs.working-directory }}

runs:
  using: composite
  steps:
    - name: Resolver metadatos del entorno
      id: meta
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        ROLE_ARN: ${{ inputs.role-to-assume }}
      run: |
        set -euo pipefail
        dir="environments/${ENVIRONMENT}"

        [[ -d "$dir" ]] || { echo "::error::No existe $dir"; exit 1; }
        [[ -f "$dir/backend.hcl" ]] || { echo "::error::Falta $dir/backend.hcl (output backend_config de bootstrap/${ENVIRONMENT})"; exit 1; }
        [[ -n "$ROLE_ARN" ]] || { echo "::error::No hay rol configurado para ${ENVIRONMENT}"; exit 1; }

        # La región sale de terraform.tfvars para no duplicarla en el pipeline
        region=$(sed -nE 's/^[[:space:]]*aws_region[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$dir/terraform.tfvars")
        [[ -n "$region" ]] || { echo "::error::aws_region no definido en $dir/terraform.tfvars"; exit 1; }

        {
          echo "working-directory=$dir"
          echo "aws-region=$region"
          echo "terraform-version=$(tr -d '[:space:]' < .terraform-version)"
        } >> "$GITHUB_OUTPUT"

    - name: Instalar Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ steps.meta.outputs.terraform-version }}
        terraform_wrapper: false

    - name: Credenciales AWS (OIDC)
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        role-session-name: gha-${{ github.run_id }}-${{ inputs.environment }}
        aws-region: ${{ steps.meta.outputs.aws-region }}

    - name: terraform init
      shell: bash
      working-directory: ${{ steps.meta.outputs.working-directory }}
      run: terraform init -input=false -backend-config=backend.hcl
